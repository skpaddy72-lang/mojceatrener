<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CAE C1 Tréner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky paper-tab navigation on top, one working column (max 980px), exam-sheet details: part labels in mono, lozenge answer letters. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunk:#e8ecf3; --ink:#152033; --muted:#566379; --line:#d5dbe6;
  --accent:#2343c4; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --ok:#17794f; --ok-bg:#dff3e9; --bad:#b83232; --bad-bg:#fbe4e4; --warn:#8a5a00; --warn-bg:#fbefd2;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171d27; --sunk:#1f2733; --ink:#e7ebf2; --muted:#9aa7ba; --line:#2c3646;
  --accent:#8ea4ff; --accent-ink:#0d1220; --accent-soft:#222c4d;
  --ok:#55c995; --ok-bg:#163427; --bad:#f28484; --bad-bg:#3d1c1f; --warn:#e6b450; --warn-bg:#3a2e12;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171d27; --sunk:#1f2733; --ink:#e7ebf2; --muted:#9aa7ba; --line:#2c3646;
  --accent:#8ea4ff; --accent-ink:#0d1220; --accent-soft:#222c4d;
  --ok:#55c995; --ok-bg:#163427; --bad:#f28484; --bad-bg:#3d1c1f; --warn:#e6b450; --warn-bg:#3a2e12;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:500}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:700;white-space:nowrap;padding-block:12px}
.brand small{font-family:var(--mono);font-weight:400;font-size:.7rem;color:var(--muted);margin-left:6px;letter-spacing:.04em}
nav{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:14px 10px;color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.lead{color:var(--muted);max-width:65ch}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.pill{font-family:var(--mono);font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
/* exam strip */
.papers{display:flex;gap:4px;height:38px}
.papers div{border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:.72rem;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap}
.papers div:nth-child(2){background:var(--ok-bg);color:var(--ok)}
.papers div:nth-child(3){background:var(--warn-bg);color:var(--warn)}
.papers div:nth-child(4){background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.scale{display:flex;gap:3px}
.scale div{padding:8px 6px;border-radius:6px;background:var(--sunk);font-size:.75rem;min-width:0;text-align:center}
.scale div b{display:block;font-family:var(--mono);font-size:.72rem;font-weight:600}
.scale .c1{background:var(--accent-soft);color:var(--accent)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.scroll{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
ul.tight{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
ul.tight li{max-width:70ch}
.en{font-style:italic}
code,.k{font-family:var(--mono);font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:4px}
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.topic>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary .tt{font-family:var(--display);font-weight:500;flex:1 1 220px;min-width:0}
details.topic>summary .tt small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.82rem}
details.topic[open]>summary{border-bottom:1px solid var(--line)}
details.topic .body{padding:18px;display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.qt{max-width:70ch}
.num{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-right:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.lz{font-family:var(--mono);font-size:.7rem;width:26px;height:18px;border:1.5px solid var(--muted);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.ok .lz{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.ex{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;max-width:70ch}
.gapin{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;flex:1 1 200px;max-width:420px}
.gapin.ok{border-color:var(--ok);background:var(--ok-bg)}
.gapin.bad{border-color:var(--bad);background:var(--bad-bg)}
.res{font-size:.88rem}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}
.kw{font-family:var(--mono);font-weight:600;letter-spacing:.05em;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px}
.card-fc{border:1px solid var(--line);border-radius:12px;background:var(--bg);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;cursor:pointer;width:100%}
.card-fc .f{font-family:var(--display);font-size:1.5rem;font-weight:500}
.card-fc .b{color:var(--accent);font-size:1.05rem}
textarea{width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px;line-height:1.6;resize:vertical}
.timer{font-family:var(--mono);font-size:1.3rem;font-variant-numeric:tabular-nums;font-weight:600}
.task{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;max-width:75ch;white-space:pre-line}
.fb{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;max-width:80ch}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.note{font-size:.82rem;color:var(--muted);max-width:75ch}
@media (max-width:560px){ .brand small{display:none} .papers div{font-size:.62rem} }
</style>

<script>
/* ===================== DATA ===================== */
const NAV=[["prehlad","Prehľad"],["cvicenia","Cvičenia"],["skuska","Skúška"],["gramatika","Gramatika"],["use-of-english","Use of English"],["slovnik","Slovná zásoba"],["pisanie","Písanie"],["hovorenie","Hovorenie"],["plan","Plán podľa učebnice"]];

// [id, EN title, SK title, unit, SB page, [points], [[question, [options], correctIdx, explanation]]]
const G=[
["past","Verb forms to talk about the past","Minulé časy, used to a would",1,177,[
 "<b>Past simple</b> – ukončené deje a sled udalostí. <b>Past continuous</b> – dej v pozadí; s <span class='k'>always</span> vyjadruje podráždenie: <span class='en'>He was always borrowing my things.</span>",
 "<b>Present perfect</b> – obdobie ešte trvá alebo má výsledok dnes (<span class='en'>since 2019, this morning</span> – ak je ešte ráno). <b>Present perfect continuous</b> zdôrazňuje trvanie.",
 "<b>Past perfect</b> – dej pred iným minulým dejom: <span class='en'>When I arrived, they had eaten.</span> (jedlo už bolo zjedené) vs <span class='en'>…they ate.</span> (až potom).",
 "<b>used to</b> – minulé zvyky aj stavy; <b>would</b> – iba opakované deje, nie stavy (<s>I would have a dog</s>)."],[
 ["When Giulia got home, her friends ___ dinner – it was already on the table.",["made","had made","have made","were making"],1,"Večera bola hotová pred jej príchodom → past perfect."],
 ["I ___ in Lisbon since 2019 and I still love it.",["lived","was living","have been living","had lived"],2,"Dej trvá doteraz + since → present perfect (continuous)."],
 ["As a child I ___ have a dog called Rex.",["would","used to","was used to","use to"],1,"Stav (have) → len used to; would sa používa iba pre opakované deje."]]],
["purpose","Expressing purpose, reason and result","Účel, dôvod a výsledok",2,170,[
 "<b>Účel:</b> <span class='k'>so (that)</span> + veta; <span class='k'>in order to / so as to / to</span> + infinitív (zápor: <span class='k'>so as not to</span>); <span class='k'>with the intention of</span> + -ing.",
 "<b>Dôvod:</b> <span class='k'>because / since / as</span> + veta; <span class='k'>because of / due to / owing to</span> + podstatné meno alebo -ing; <span class='k'>in case</span> = pre prípad, že.",
 "<b>Výsledok:</b> <span class='k'>so</span>, <span class='k'>with the result that</span>; na začiatku novej vety <span class='k'>Consequently / Therefore / As a result</span>. <span class='k'>otherwise</span> = lebo inak."],[
 ["Take an umbrella ___ it rains later.",["so that","in case","otherwise","due to"],1,"in case = pre prípad, že (dáždnik beriem vopred)."],
 ["All flights were cancelled ___ the fog.",["because","since","owing to","so as to"],2,"Pred podstatným menom: owing to / due to / because of."],
 ["She whispered ___ wake the baby.",["so as not to","so that not","for not to","in order not"],0,"Záporný účel: so as not to / in order not to + infinitív."]]],
["nonenot","no, none, not","no, none, not",3,173,[
 "<b>no</b> + podstatné meno = not any: <span class='en'>There is no evidence.</span>",
 "<b>none</b> je zámeno – stojí samo alebo s <span class='k'>of</span> + the/my/these/zámeno: <span class='en'>None of the candidates…</span>",
 "<b>not</b> popiera sloveso, prídavné meno alebo kvantifikátor: <span class='en'>not everyone, not many, not all, not a single…</span>"],[
 ["___ of the candidates had the right experience.",["No","None","Not","Nobody"],1,"Pred of + skupina → none."],
 ["There is ___ evidence that the treatment works.",["none","not","no","not any of"],2,"no + podstatné meno."],
 ["___ everyone agrees with the proposal.",["No","None","Not","Nor"],2,"Pred every/all/many sa používa not."]]],
["passive","The passive","Trpný rod",3,173,[
 "Tvar: <span class='k'>be</span> + past participle. Používa sa, keď pôvodca nie je známy alebo dôležitý, a vo formálnom či odbornom štýle (reporty, proposals).",
 "<b>Reporting passive:</b> <span class='en'>It is said that he is rich.</span> = <span class='en'>He is said to be rich.</span> Pre minulosť: <span class='en'>He is believed to have left.</span> Prebiehajúci dej: <span class='en'>is thought to be living…</span>",
 "<b>have / get something done</b> – službu vykoná niekto iný: <span class='en'>I had my laptop repaired.</span>"],[
 ["The suspect is believed ___ the country last week.",["to leave","to have left","having left","that he left"],1,"Skorší dej po reporting passive → to have + past participle."],
 ["The new bridge ___ at the moment.",["is building","is built","is being built","has built"],2,"Prebiehajúci dej v trpnom rode: is being built."],
 ["I must ___ before the interview.",["have my suit cleaned","have cleaned my suit","be cleaned my suit","get my suit clean"],0,"have + predmet + past participle = dať si niečo urobiť."]]],
["certainty","Expressing possibility, probability and certainty","Možnosť, pravdepodobnosť, istota",4,169,[
 "<b>Možnosť:</b> <span class='k'>may / might / could</span> (konkrétna situácia); <span class='k'>can</span> len pre všeobecnú možnosť: <span class='en'>It can get cold here.</span> Silnejšie: <span class='k'>may well</span>; slabšie: <span class='k'>just might, could conceivably</span>.",
 "<b>Pravdepodobnosť:</b> <span class='k'>should</span>, <span class='k'>be (highly) likely / unlikely to</span>, <span class='k'>there's every likelihood that…</span>",
 "<b>Istota:</b> <span class='k'>must</span> (určite áno), <span class='k'>can't / couldn't</span> (určite nie), <span class='k'>be bound to</span>. Minulosť: modal + <span class='k'>have</span> + past participle."],[
 ["With that much experience, she's ___ to get the job.",["bound","probable","possibly","must"],0,"be bound to = určite sa to stane."],
 ["He ___ have read the email – he knew nothing about the meeting.",["mustn't","can't","may","should"],1,"Logická nemožnosť v minulosti: can't have + pp (nie mustn't)."],
 ["It ___ get very cold here in winter.",["can","might well have","must have","is bound"],0,"Všeobecná možnosť → can."]]],
["inf-ing","Verbs + to infinitive or -ing","Sloveso + infinitív alebo -ing",5,179,[
 "<b>+ to infinitív:</b> afford, agree, arrange, fail, manage, offer, refuse, tend, threaten. <b>+ -ing:</b> avoid, consider, delay, deny, enjoy, involve, mind, risk, suggest.",
 "<b>Zmena významu:</b> <span class='en'>remember/forget doing</span> (spomienka) vs <span class='en'>to do</span> (povinnosť); <span class='en'>stop doing</span> (prestať) vs <span class='en'>stop to do</span> (zastaviť sa, aby…); <span class='en'>try doing</span> (experiment) vs <span class='en'>try to do</span> (snaha); <span class='en'>regret doing</span> vs <span class='en'>regret to inform</span>; <span class='en'>mean doing</span> (obnášať) vs <span class='en'>mean to do</span> (mať v úmysle)."],[
 ["I'll never forget ___ the sea for the first time.",["to see","seeing","see","to have seen"],1,"Spomienka na minulý zážitok → forget + -ing."],
 ["He stopped ___ a coffee and then drove on.",["buying","to buy","buy","having bought"],1,"stop to do = zastaviť sa za účelom."],
 ["The job involves ___ abroad several times a year.",["to travel","travel","travelling","to travelling"],2,"involve + -ing."]]],
["repetition","Avoiding repetition","Ako sa vyhnúť opakovaniu",6,164,[
 "Zámená a odkazovacie slová: <span class='k'>it, this, that, they</span>; <span class='k'>one / ones</span>; <span class='k'>another, the other, the others</span>; <span class='k'>both, neither, all, none</span>.",
 "Pomocné sloveso namiesto celej frázy: <span class='en'>Few people have read it, but I have.</span> · <span class='k'>do so</span>: <span class='en'>I asked them to leave and they did so.</span>",
 "<span class='k'>so / not</span> po think, hope, suppose: <span class='en'>I think so. I hope not.</span> · Samotné <span class='k'>to</span>: <span class='en'>I didn't want to.</span> V eseji je to kľúč k hodnoteniu Organisation."],[
 ["I've never been skiing, but I'd love ___.",["it","to","so","do"],1,"Namiesto 'to go skiing' stačí to."],
 ["'Is Ana coming tonight?' 'I think ___.'",["it","that","so","yes"],2,"think / hope / suppose + so."],
 ["Two of the paintings were sold; ___ are still in the gallery.",["another","the other","others ones","the others"],3,"Zvyšok konkrétnej skupiny → the others."]]],
["linking","Linking ideas: relative & participle clauses, apposition","Vzťažné a príčasťové vety",7,171,[
 "<b>Defining</b> (bez čiarok, možno <span class='k'>that</span>, predmetové zámeno možno vynechať) vs <b>non-defining</b> (čiarky, nikdy <span class='k'>that</span>). Komentár k celej vete: <span class='en'>…, which is why I stayed in.</span>",
 "Formálne: predložka + <span class='k'>whom / which</span>: <span class='en'>the person to whom I spoke</span>.",
 "<b>Participle clauses</b> (rovnaký podmet!): <span class='en'>Opening the door, I saw…</span> · <span class='en'>Having finished, she left.</span> · trpný význam: <span class='en'>Built in 1889, the tower…</span>",
 "<b>Apposition:</b> dve menné frázy vedľa seba: <span class='en'>Lisbon, the capital of Portugal, …</span>"],[
 ["My brother, ___ lives in Oslo, is a pilot.",["that","who","whom","which"],1,"Non-defining veta o osobe → who, nie that."],
 ["___ the report, she switched off her laptop and went home.",["Finished","Having finished","Being finished","To finish"],1,"Dej pred hlavným dejom → perfect participle."],
 ["___ in small quantities, dark chocolate is good for you.",["Eating","Having eaten","Eaten","Being eating"],2,"Trpný význam (čokoláda je jedená) → past participle."]]],
["reported","Reported speech","Nepriama reč",8,174,[
 "Posun časov o krok do minulosti, zmena zámen a výrazov času (<span class='en'>tomorrow → the next day</span>). V otázkach oznamovací slovosled: <span class='en'>She asked where I lived.</span>",
 "<b>Vzorce slovies:</b> + to inf: agree, offer, promise, refuse, threaten · + predmet + to inf: advise, remind, urge, warn · + -ing: admit, deny, suggest, recommend · + predložka + -ing: accuse sb of, apologise for, insist on, congratulate sb on."],[
 ["She asked me where ___.",["did I live","I lived","do I live","lived I"],1,"V nepriamej otázke nie je inverzia."],
 ["He denied ___ the money.",["to take","taking","that he takes","to have take"],1,"deny + -ing."],
 ["They warned us ___ in the river.",["not to swim","to not swimming","don't swim","against swim"],0,"warn + predmet + (not) to infinitív."]]],
["transitive","Transitive verbs","Prechodné a neprechodné slovesá",8,177,[
 "<b>Prechodné</b> slovesá musia mať predmet (<span class='en'>raise, discuss, enjoy, lay</span>). <b>Neprechodné</b> predmet nemajú a nedajú sa dať do trpného rodu (<span class='en'>rise, arrive, happen, occur, lie</span>).",
 "Časté chyby: <s>was happened</s>, <s>discuss about</s>. Páry: <span class='en'>raise (sth) / rise</span>, <span class='en'>lay (sth) / lie</span>."],[
 ["Prices have ___ sharply this year.",["raised","been risen","risen","rose up"],2,"rise je neprechodné: rise – rose – risen."],
 ["The accident ___ at noon.",["was happened","happened","has been happened","was happening by"],1,"happen nemá trpný rod."],

let typing=null;
function ansVariants(s){
  const v=new Set([norm(s.replace(/\([^)]*\)/g,"")),norm(s.replace(/[()]/g,""))]);
  for(const x of [...v]){v.add(x.replace(/^(a|an|the) /,""));v.add(x.replace(/somebody/g,"sb"));v.add(x.replace(/somebody/g,"someone"));v.add(x.replace(/something/g,"sth"))}
  return [...v].filter(Boolean);
}
function makeTyping(d){
  let qs;
  if(d.type==="gap")qs=d.cards.map(c=>{const w=c[1][c[2]];return{q:c[0],ans:[norm(w)],h:w,full:c[0].replace("___",w)}});
  else if(d.type==="verb")qs=d.cards.map((c,i)=>({q:"___ "+c[0],ans:[c[1],norm(c[1]+" "+c[0])],h:c[1],full:c[1]+" "+c[0],key:d.id+"."+i}));
  else if(d.type==="prep")qs=d.cards.map((c,i)=>({q:c[0]+" ___",ans:[c[1],norm(c[0]+" "+c[1])],h:c[1],full:c[0]+" "+c[1],key:d.id+"."+i}));
  else qs=d.cards.map((c,i)=>{const a=ansVariants(c[0]);return{q:c[1],sk:true,ans:a,h:a[0],full:c[0],key:d.id+"."+i}});
  return{qs:shuffle(qs),pos:0,score:0,res:null,hint:false};
}
function typingCheck(){
  if(!typing||typing.res)return;const inp=$("#tin"),q=typing.qs[typing.pos];if(!inp||!inp.value.trim())return;
  const ok=q.ans.includes(norm(inp.value));typing.res={ok,v:inp.value};
  if(ok){typing.score++;if(q.key){S.known[q.key]=1;save()}}
  $("#deck").innerHTML=deckHTML();const b=$("[data-tnext]");if(b)b.focus();
}
function typingNext(){if(!typing)return;typing.pos++;typing.res=null;typing.hint=false;$("#deck").innerHTML=deckHTML();const i=$("#tin");if(i)i.focus()}
function makeQuiz(d,all){
  let qs;
  if(d.type==="gap")qs=d.cards.map(c=>({q:c[0],o:c[1],a:c[2]}));
  else if(d.type==="verb")qs=d.cards.map(c=>({q:"___ "+c[0],o:d.opts,a:d.opts.indexOf(c[1])}));
  else if(d.type==="prep")qs=d.cards.map(c=>{const o=shuffle([c[1],...shuffle(PREPS.filter(p=>p!==c[1])).slice(0,3)]);return{q:c[0]+" ___",o,a:o.indexOf(c[1])}});
  else qs=d.cards.map(c=>{const o=shuffle([c[0],...shuffle(d.cards.filter(x=>x!==c).map(x=>x[0])).slice(0,3)]);return{q:"„"+c[1]+"“",o,a:o.indexOf(c[0])}});
  return{qs:shuffle(qs).slice(0,all?999:10),pos:0,score:0,ch:null};
}

async function genAI(type,topic){
  const btn=$("[data-startai]"),stat=$("#aistat");if(!sampleFn)return;
  if(btn)btn.disabled=true;if(stat){stat.hidden=false;stat.textContent="Claude píše cvičenie. Trvá to asi 10 až 30 sekúnd."}
  const theme=UN[Math.floor(Math.random()*UN.length)][1],g=G.find(t=>t[0]===topic);
  const [task,shape]=AISPEC[type](8,g?g[1]:"");
  const prompt=`You are an item writer for the Cambridge C1 Advanced (CAE) exam. ${task}\nContext theme for variety: "${theme}" (variation seed ${Math.floor(Math.random()*100000)}).\nLanguage level: C1. Vary the position of the correct answer. Write each "explanation" in Slovak, at most 20 words.\nReply with JSON only, exactly in this shape:\n${shape}`;
  try{
    let data=await sampleFn.json(prompt,{cache:false});
    if(typeof data==="string")data=JSON.parse(data);
    const items=[];
    for(const it of (data&&data.items)||[]){
      const ex=esc(it.explanation||"");
      if(Array.isArray(it.options)){const a=+it.answer;if(it.options.length===4&&a>=0&&a<=3&&it.q)items.push({k:"mc",q:esc(it.q),o:it.options.map(esc),a,ex})}
      else if(Array.isArray(it.answers)){const ans=it.answers.map(norm).filter(Boolean);if(!ans.length)continue;
        if(type==="p4"&&it.first&&it.second&&it.key)items.push({k:"tx",html:p4HTML(esc(it.first),esc(it.key),esc(it.second)),ans,ex});
        else if(type==="p3"&&it.q&&it.stem)items.push({k:"tx",html:gapHTML(esc(it.q))+` <span class="kw">${esc(it.stem)}</span>`,ans,ex});
        else if(it.q)items.push({k:"tx",html:gapHTML(esc(it.q)),ans,ex})}
    }
    if(!items.length)throw new Error("empty");
    const label=AIT.find(t=>t[0]===type)[1]+(g?" · "+g[1]:"");
    const sess={title:data.title?esc(data.title):label,items,re:{src:"ai",type,topic},multi:type==="p4"};
    if(type==="read"&&data.passage)sess.passage=esc(data.passage);
    if(type==="listen"&&data.script)sess.script=esc(data.script);
    startSession(sess);
  }catch(err){
    if(stat){stat.hidden=false;stat.textContent=err&&err.code==="rate_limited"?"Priveľa požiadaviek naraz. Skús to o chvíľu.":err&&err.code==="not_granted"?"Stránka nemá povolenie pýtať sa Clauda. Povolíš ho v ponuke Permissions pri artifacte.":"Cvičenie sa nepodarilo vytvoriť. Skús to ešte raz."}
    if(btn)btn.disabled=false;
  }
}
function syncAI(){$$("[data-feedback],[data-spfb]").forEach(b=>b.hidden=false);const b=$("[data-startai]");if(b){b.disabled=false;const n=$("#ainote");if(n)n.hidden=true}}
async function askFeedback(btn,out,prompt){
  btn.disabled=true;out.hidden=false;out.textContent="Claude číta tvoj text…";
  try{const r=await sampleFn(prompt,{cache:false,onText:({text})=>{out.textContent=text}});out.textContent=r.text}
  catch(err){out.textContent=err&&err.code==="rate_limited"?"Priveľa požiadaviek naraz. Skús to o chvíľu.":"Spätnú väzbu sa teraz nepodarilo získať. Text si môžeš skopírovať a poslať Claudovi v chate."}
  btn.disabled=false;
}

let sampleFn=null;
V.pisanie=()=>{
  const w=W.find(x=>x.id===S.wtype)||W[0],task=TASKS[S.task]||TASKS[0];
  return `<div class="head"><span class="eyebrow">Writing · Writing reference s. 184</span><h1>Písanie</h1><p class="lead">Dva texty po 220 až 260 slov, na každý asi 45 minút. Najprv si pozri stavbu žánru, potom si vyber zadanie a píš na čas.</p></div>
  <div class="row">${W.map(x=>`<button class="btn" data-wtype="${x.id}" aria-pressed="${x.id===w.id}">${x.t}</button>`).join("")}</div>
  <div class="panel"><div class="row sp"><h2>${w.t}</h2><span class="pill acc">${w.part}</span></div><p><b>Štýl:</b> ${w.reg}</p>
   <div class="grid"><div><span class="eyebrow">Stavba</span><ul class="tight" style="margin-top:8px">${w.str.map(s=>`<li>${s}</li>`).join("")}</ul></div><div><span class="eyebrow">Užitočné frázy</span><ul class="tight en" style="margin-top:8px">${w.ph.map(s=>`<li>${s}</li>`).join("")}</ul></div></div><p class="note">${w.tip}</p></div>
  <div class="panel"><div class="row sp"><h2>Tréning na čas</h2>${timerHTML("w",2700,"45 minút na jeden text")}</div>
   <div class="row"><label for="tasksel" class="eyebrow">Zadanie</label><select id="tasksel" class="gapin">${TASKS.map((t,i)=>`<option value="${i}" ${i===S.task?"selected":""}>${i+1}. ${W.find(x=>x.id===t[0]).t}</option>`).join("")}</select></div>
   <div class="task">${esc(task[1])}</div>
   <textarea id="draft" placeholder="Sem píš svoj text…" spellcheck="false">${esc(S.draft||"")}</textarea>
   <div class="row sp"><span id="wc" class="pill"></span><span class="row"><button class="btn" data-copy>Kopírovať text</button><button class="btn pri" data-feedback hidden>Spätná väzba od Clauda</button></span></div>
   <div id="fb" class="fb" hidden></div>
   <div><span class="eyebrow">Kontrola pred odovzdaním</span><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${CHECK.map((c,i)=>`<label class="chk"><input type="checkbox" id="chk${i}" data-chk="${i}" ${S.chk[i]?"checked":""}> ${c}</label>`).join("")}</div></div>
   <p class="note">Tip z učebnice: veď si zoznam vlastných opakovaných chýb a pred odovzdaním text skontroluj práve na ne.</p></div>`;
};
function wcUpdate(){const t=$("#draft"),el=$("#wc");if(!t||!el)return;const n=(t.value.trim().match(/\S+/g)||[]).length;el.textContent=n+" slov · cieľ 220–260";el.className="pill "+(n>=220&&n<=260?"ok":"");}

let spPrompt=null;
V.hovorenie=()=>`<div class="head"><span class="eyebrow">Speaking · Speaking reference s. 194</span><h1>Hovorenie</h1><p class="lead">Pätnásť minút vo dvojici, štyri časti. Vygeneruj si úlohu, spusti časovač a hovor nahlas – ideálne sa nahraj na telefón a vypočuj si to.</p></div>
 <div class="panel"><h2>Tréning</h2><div class="row"><button class="btn" data-sp="p1">Part 1: otázka</button><button class="btn" data-sp="p2">Part 2: long turn</button><button class="btn" data-sp="p3">Part 3: spoločná úloha</button><button class="btn" data-sp="p4">Part 4: diskusia</button></div><div id="spbox">${spHTML()}</div></div>
 <div class="grid">${SP.map(p=>`<div class="panel"><div class="row sp"><h2>${p.t}</h2><span class="pill acc">${p.time}</span></div><h3>${p.n}</h3><p>${p.d}</p><ul class="tight">${p.tips.map(t=>`<li>${t}</li>`).join("")}</ul><span class="eyebrow">Frázy</span><ul class="tight en">${p.ph.map(t=>`<li>${t}</li>`).join("")}</ul></div>`).join("")}</div>`;
function spHTML(){
  if(!spPrompt)return `<p class="note">Vyber časť skúšky a zobrazí sa náhodná úloha s časovačom.</p>`;
  const cfg={p1:[30,"asi 30 sekúnd na odpoveď"],p2:[60,"presne 1 minúta"],p3:[120,"2 minúty diskusia, potom 1 minúta na rozhodnutie"],p4:[60,"asi 1 minúta na rozvinutú odpoveď"]}[spPrompt.k];
  return `<div class="task" style="margin-top:12px">${esc(spPrompt.t)}</div><div style="margin-top:12px">${timerHTML("sp",cfg[0],cfg[1])}</div>
  <textarea id="spans" style="min-height:120px;margin-top:12px" placeholder="Napíš sem po anglicky, čo by si povedal. Dá sa aj nadiktovať cez mikrofón na klávesnici." spellcheck="false"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn pri" data-spfb ${sampleFn?"":"hidden"}>Spätná väzba od Clauda</button></div><div id="spfb" class="fb" hidden style="margin-top:8px"></div>`;
}

V.plan=()=>`<div class="head"><span class="eyebrow">Map of the units</span><h1>Plán podľa učebnice</h1><p class="lead">Štrnásť lekcií a čo v nich nájdeš. SB je Student's Book, WB je Workbook. Po každých dvoch lekciách je v učebnici „Vocabulary and grammar review“.</p></div>
 ${UN.map(u=>`<div class="panel"><div class="row sp"><label class="chk" style="font-size:1rem"><input type="checkbox" id="un${u[0]}" data-unit="${u[0]}" ${S.units[u[0]]?"checked":""}><h2>${u[0]}. ${u[1]}</h2></label><span class="row"><span class="pill">SB s. ${u[2]}</span><span class="pill">WB s. ${u[3]}</span></span></div>
  <div class="scroll"><table><tbody><tr><th>Gramatika</th><td>${u[4]}</td></tr><tr><th>Slovná zásoba</th><td>${u[5]}</td></tr><tr><th>Reading &amp; UoE</th><td>${u[6]}</td></tr><tr><th>Writing</th><td>${u[7]}</td></tr><tr><th>Listening</th><td>${u[8]}</td></tr><tr><th>Speaking</th><td>${u[9]}</td></tr></tbody></table></div></div>`).join("")}
 <p class="note">Na konci Student's Book: Language reference (s. 162), Writing reference (s. 184), Speaking reference (s. 194) a kľúč odpovedí (s. 199).</p>`;

/* ===================== ROUTER ===================== */
function route(){const r=location.hash.slice(1);return V[r]?r:"prehlad"}
function render(keepScroll){
  stopTimers();const r=route(),y=window.scrollY;
  $("#nav").innerHTML=NAV.map(n=>`<a href="#${n[0]}" ${n[0]===r?'aria-current="page"':""}>${n[1]}</a>`).join("");
  app.innerHTML=V[r]();
  if(r==="pisanie")wcUpdate();
  if(sampleFn)syncAI();
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
  const cur=$('#nav a[aria-current]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:"nearest",inline:"nearest"});
}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(V[h]||!h)render(false)});

/* ===================== EVENTS ===================== */
app.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-deck]");if(!t)return;
  // multiple choice
  const mcEl=t.closest("[data-mc]");
  if(mcEl&&t.classList.contains("opt")){
    const a=+mcEl.dataset.a,i=+t.dataset.i;S.ans[mcEl.dataset.mc]={c:i,ok:i===a};save();
    $$(".opt",mcEl).forEach((b,j)=>{b.disabled=true;if(j===a)b.classList.add("ok");else if(j===i)b.classList.add("bad")});
    $(".ex",mcEl).hidden=false;refreshBadges();return;
  }
  if(t.hasAttribute("data-check")){checkText(t.closest("[data-tc]"));return}
  if(t.dataset.reset){const p=t.dataset.reset;for(const m of [S.ans,S.txt])for(const k in m)if(k.startsWith(p))delete m[k];save();
    const open=$$("details[open]").map(d=>d.id);render(true);open.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true});return}
  if(t.dataset.uoe){S.uoe=t.dataset.uoe;save();render(true);return}
  // practice hub
  if(t.dataset.pc){S.pc=t.dataset.pc;save();render(true);return}
  if(t.dataset.pn){S.pn=+t.dataset.pn;save();render(true);return}
  if(t.hasAttribute("data-startbank")){startBank(S.pc,S.pn);return}
  if(t.hasAttribute("data-startai")){genAI(S.aitype,S.aitopic);return}
  if(t.hasAttribute("data-again")){const re=S.sess&&S.sess.re;if(!re)return;if(re.src==="bank")startBank(re.cat,re.n);else if(sampleFn){t.disabled=true;t.textContent="Claude píše cvičenie…";genAI(re.type,re.topic).then(()=>{t.disabled=false;t.textContent="Ďalšie také cvičenie"})}return}
  if(t.hasAttribute("data-closesess")){clearX();S.sess=null;save();if(ttsFn)try{ttsFn.stop()}catch(_){}render(true);return}
  if(t.hasAttribute("data-play")){const st=$("#playstat");if(!ttsFn||!S.sess)return;const raw=$("#script").textContent.slice(0,2000);st.textContent="Prehráva sa nahrávka…";ttsFn.speak(raw,{language:"en"}).then(()=>{st.textContent="Nahrávka skončila. Môžeš si ju pustiť ešte raz."}).catch(err=>{st.textContent=err&&err.code==="not_granted"?"Prehrávanie hlasu nie je povolené. Otvor si prepis.":"Prehrávanie sa zastavilo."});return}
  if(t.hasAttribute("data-stopplay")){if(ttsFn)try{ttsFn.stop()}catch(_){}return}
  if(t.hasAttribute("data-script")){const sc=$("#script");sc.hidden=!sc.hidden;t.textContent=sc.hidden?"Zobraziť prepis":"Skryť prepis";return}
  if(t.hasAttribute("data-spfb")){spFeedback(t);return}
  // vocab
  if(t.dataset.deck){deckId=t.dataset.deck;fc={i:0,flip:false};quiz=null;typing=null;render(true);const el=$("#deck");if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});return}
  const d=D.find(x=>x.id===deckId);
  const redeck=()=>{$("#deck").innerHTML=deckHTML()};
  if(t.hasAttribute("data-flip")){fc.flip=!fc.flip;redeck();return}
  if(t.hasAttribute("data-fprev")){fc.i=(fc.i-1+d.cards.length)%d.cards.length;fc.flip=false;redeck();return}
  if(t.dataset.fknow){const k=d.id+"."+fc.i;if(t.dataset.fknow==="1")S.known[k]=1;else delete S.known[k];save();fc.i=(fc.i+1)%d.cards.length;fc.flip=false;redeck();return}
  if(t.hasAttribute("data-quiz")){typing=null;quiz=makeQuiz(d);redeck();return}
  if(t.hasAttribute("data-fcmode")){quiz=null;typing=null;redeck();return}
  if(t.hasAttribute("data-typing")){quiz=null;typing=makeTyping(d);redeck();const i=$("#tin");if(i)i.focus();return}
  if(t.hasAttribute("data-tcheck")){typingCheck();return}
  if(t.hasAttribute("data-tnext")){typingNext();return}
  if(t.hasAttribute("data-thint")){typing.hint=true;const v=$("#tin").value;redeck();const i=$("#tin");i.value=v;i.focus();return}
  if(t.dataset.qi!==undefined&&quiz){quiz.ch=+t.dataset.qi;if(quiz.ch===quiz.qs[quiz.pos].a)quiz.score++;redeck();return}
  if(t.hasAttribute("data-qnext")&&quiz){quiz.pos++;quiz.ch=null;redeck();return}
  // writing
  if(t.dataset.wtype){S.wtype=t.dataset.wtype;save();render(true);return}
  if(t.hasAttribute("data-copy")){const ta=$("#draft");try{await navigator.clipboard.writeText(ta.value);t.textContent="Skopírované"}catch(_){ta.select()}return}
  if(t.hasAttribute("data-feedback")){feedback(t);return}
  // speaking
  if(t.dataset.sp){const k=t.dataset.sp,a=SPQ[k];let n;do{n=a[Math.floor(Math.random()*a.length)]}while(spPrompt&&n===spPrompt.t&&a.length>1);spPrompt={k,t:n};stopTimers();$("#spbox").innerHTML=spHTML();return}
  // timers
  const tm=t.closest("[data-timer]");
  if(tm){const id=tm.dataset.timer,total=+tm.dataset.sec,out=$("#t-"+id);
    if(t.hasAttribute("data-treset")){if(timers[id]){clearInterval(timers[id].h);delete timers[id]}out.textContent=fmt(total);$("[data-tstart]",tm).textContent="Štart";out.style.color="";return}
    if(t.hasAttribute("data-tstart")){
      if(timers[id]&&timers[id].run){clearInterval(timers[id].h);timers[id].run=false;t.textContent="Pokračovať";return}
      const st=timers[id]||(timers[id]={left:total});if(st.left<=0)st.left=total;st.run=true;t.textContent="Pauza";out.style.color="";
      st.h=setInterval(()=>{st.left--;out.textContent=fmt(Math.max(st.left,0));if(st.left<=0){clearInterval(st.h);st.run=false;out.style.color="var(--bad)";out.textContent="00:00 · čas vypršal";t.textContent="Štart"}},1000);}
  }
});
function checkText(box){
  if(!box)return;const key=box.dataset.tc,answers=box.dataset.ans.split("|"),inp=$("input",box),v=inp.value;if(!v.trim())return;
  const ok=answers.includes(norm(v));S.txt[key]={v,ok};save();
  inp.classList.toggle("ok",ok);inp.classList.toggle("bad",!ok);
  const res=$(".res",box);
  res.innerHTML=resText(ok,answers,box.dataset.note||"");res.className="res "+(ok?"ok":"bad");res.hidden=false;refreshBadges();
}
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tin"){e.preventDefault();typingCheck();return}if(e.key==="Enter"&&e.target.classList.contains("gapin")&&e.target.tagName==="INPUT")checkText(e.target.closest("[data-tc]"))});
app.addEventListener("input",e=>{if(e.target.id==="draft"){S.draft=e.target.value;save();wcUpdate()}});
app.addEventListener("change",e=>{const t=e.target;
  if(t.id==="tasksel"){S.task=+t.value;S.wtype=TASKS[S.task][0];save();render(true)}
  if(t.id==="aitype"){S.aitype=t.value;save();render(true)}
  if(t.id==="aitopic"){S.aitopic=t.value;save()}
  if(t.dataset.chk!==undefined){S.chk[t.dataset.chk]=t.checked;save()}
  if(t.dataset.unit){S.units[t.dataset.unit]=t.checked;save()}
});

async function feedback(btn){
  const text=($("#draft").value||"").trim(),out=$("#fb");out.hidden=false;
  if(text.split(/\s+/).length<60){out.textContent="Napíš aspoň 60 slov, aby mala spätná väzba zmysel.";return}
  const task=TASKS[S.task],words=(text.match(/\S+/g)||[]).length;
  const prompt=`Si skúsený examinátor Cambridge C1 Advanced (CAE) Writing. Ohodnoť text kandidáta. Odpovedaj po slovensky, anglické citácie nechaj v angličtine. Píš obyčajný text bez markdownu a bez hviezdičiek.\n\nŽáner: ${task[0]}\nZadanie:\n${task[1]}\n\nText kandidáta (${words} slov; požadovaný rozsah je 220–260):\n"""\n${text}\n"""\n\nŠtruktúra odpovede:\n1) Hodnotenie 0–5 za Content, Communicative Achievement, Organisation a Language, ku každému jedna až dve vety zdôvodnenia.\n2) Najviac päť konkrétnych chýb vo formáte: pôvodná formulácia → oprava (krátke vysvetlenie).\n3) Tri návrhy, ako text posunúť na úroveň C1: pokročilejšia slovná zásoba, spojovacie výrazy alebo štruktúry ako inverzia, cleft sentences, participle clauses.\n4) Jedna veta o tom, či by text na skúške pravdepodobne obstál.`;
  await askFeedback(btn,out,prompt);
}
async function spFeedback(btn){
  const text=($("#spans").value||"").trim(),out=$("#spfb");out.hidden=false;
  if(!spPrompt||text.split(/\s+/).length<15){out.textContent="Napíš aspoň pár viet, aby mala spätná väzba zmysel.";return}
  const part={p1:"Part 1 (interview)",p2:"Part 2 (long turn, 1 minute)",p3:"Part 3 (collaborative task)",p4:"Part 4 (discussion)"}[spPrompt.k];
  const prompt=`Si skúsený examinátor Cambridge C1 Advanced (CAE) Speaking. Kandidát si písomne zapísal, čo by povedal. Odpovedaj po slovensky, anglické citácie nechaj v angličtine. Píš obyčajný text bez markdownu a bez hviezdičiek.\n\nČasť skúšky: ${part}\nÚloha:\n${spPrompt.t}\n\nOdpoveď kandidáta:\n"""\n${text}\n"""\n\nŠtruktúra odpovede:\n1) Krátke hodnotenie: Grammatical Resource, Lexical Resource, Discourse Management (pri Part 3 aj Interactive Communication). Výslovnosť nehodnoť.\n2) Najviac štyri chyby vo formáte: pôvodná formulácia → oprava.\n3) Tri frázy alebo štruktúry úrovne C1, ktoré by sa do odpovede hodili.\n4) Vzorová odpoveď v angličtine, asi 90 slov.`;
  await askFeedback(btn,out,prompt);
}
if(window.claude&&window.claude.use){
  window.claude.use("sample").then(s=>{if(!s)return;sampleFn=s;syncAI()}).catch(()=>{});
  window.claude.use("tts").then(t=>{if(!t)return;ttsFn=t;if(route()==="cvicenia"&&!S.sess)render(true)}).catch(()=>{});
}

render(false);
</script>
